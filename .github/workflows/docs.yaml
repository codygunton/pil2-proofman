name: Deploy Docs

on:
  push:
    branches: [python-spec, executable-specs]
    paths:
      - 'docs/sphinx/**'
      - 'executable-spec/**/*.py'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout zisk submodule for Rust source links
        run: git submodule update --init docs/sphinx/zisk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install \
            'sphinx>=7.0' \
            'myst-parser>=3.0' \
            'sphinx-book-theme>=1.1' \
            'sphinx-copybutton>=0.5' \
            'sphinx-design>=0.6' \
            'sphinxcontrib-mermaid>=1.0' \
            'sphinx-autoapi>=3.7' \
            'numpy>=1.24.0'

      - name: Build HTML
        run: sphinx-build -b html docs/sphinx docs/sphinx/_build/html

      - name: Include archived versions
        run: |
          for dir in docs/archive/*/; do
            tag=$(basename "$dir")
            cp -r "$dir" docs/sphinx/_build/html/"$tag"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

      - id: deploy
        uses: actions/deploy-pages@v4
